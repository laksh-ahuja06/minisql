<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1060" width="1000" height="1060" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9A6A12"/>
    </marker>
    <style>
      .t  { font-size: 15px; font-weight: 700; fill: #111827; }
      .f  { font-size: 11px; font-family: Menlo, Consolas, monospace; fill: #4B5563; }
      .b  { font-size: 12px; fill: #1F2937; }
      .lbl{ font-size: 12px; font-weight: 600; fill: #111827; }
      .dl { font-size: 11px; fill: #9A6A12; font-style: italic; }
      .flow { stroke: #374151; stroke-width: 2; fill: none; }
      .dep  { stroke: #9A6A12; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    </style>
  </defs>

  <rect width="1000" height="1060" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">MiniSQL — Compiler &amp; Execution Architecture</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#6B7280">Centre column = compiler pipeline (solid arrows: data flow) · Side boxes = shared modules (dashed: “uses”)</text>

  <!-- ===================== ROW 1: build / input / tests ===================== -->
  <rect x="40" y="90" width="230" height="70" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="155" y="112" text-anchor="middle" class="t">Build</text>
  <text x="155" y="129" text-anchor="middle" class="f">Makefile · build.sh</text>
  <text x="155" y="147" text-anchor="middle" class="b">g++ src/*.cpp → ./sqlcompiler</text>

  <rect x="330" y="90" width="340" height="70" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="500" y="112" text-anchor="middle" class="t">SQL source text</text>
  <text x="500" y="131" text-anchor="middle" class="b">./sqlcompiler file.sql  (argv[1])</text>
  <text x="500" y="148" text-anchor="middle" class="b">or the built-in demo string in main()</text>

  <rect x="730" y="90" width="230" height="70" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="845" y="112" text-anchor="middle" class="t">tests/*.sql</text>
  <text x="845" y="129" text-anchor="middle" class="f">sample1 · crud_test · case_study</text>
  <text x="845" y="146" text-anchor="middle" class="f">error · sample2</text>
  <line x1="730" y1="125" x2="674" y2="125" class="flow" marker-end="url(#arr)"/>

  <!-- ===================== main.cpp ===================== -->
  <line x1="500" y1="160" x2="500" y2="196" class="flow" marker-end="url(#arr)"/>
  <rect x="330" y="200" width="340" height="96" rx="8" fill="#EDE7F6" stroke="#6A4FB5" stroke-width="2"/>
  <text x="500" y="222" text-anchor="middle" class="t">Driver</text>
  <text x="500" y="238" text-anchor="middle" class="f">src/main.cpp · runQuery()</text>
  <text x="500" y="258" text-anchor="middle" class="b">Reads file, creates Catalog + Storage + Executor,</text>
  <text x="500" y="274" text-anchor="middle" class="b">runs steps ①–④, catches errors → “ERROR: …”</text>
  <text x="500" y="289" text-anchor="middle" class="f">printStmt/printExpr: AST printers (unused)</text>

  <!-- ===================== Lexer ===================== -->
  <line x1="500" y1="296" x2="500" y2="346" class="flow" marker-end="url(#arr)"/>
  <text x="512" y="326" class="lbl">① raw SQL std::string</text>
  <rect x="330" y="350" width="340" height="80" rx="8" fill="#E8F0FE" stroke="#3B6FD8" stroke-width="2"/>
  <text x="500" y="372" text-anchor="middle" class="t">Lexer — lexical analysis</text>
  <text x="500" y="388" text-anchor="middle" class="f">src/lexer.h · src/lexer.cpp</text>
  <text x="500" y="406" text-anchor="middle" class="b">Scans chars → tokens; keywords case-insensitive,</text>
  <text x="500" y="421" text-anchor="middle" class="b">skips “--” comments, string escapes, line numbers</text>

  <!-- ===================== Parser ===================== -->
  <line x1="500" y1="430" x2="500" y2="476" class="flow" marker-end="url(#arr)"/>
  <text x="512" y="458" class="lbl">② std::vector&lt;Token&gt;</text>
  <rect x="330" y="480" width="340" height="80" rx="8" fill="#E8F0FE" stroke="#3B6FD8" stroke-width="2"/>
  <text x="500" y="502" text-anchor="middle" class="t">Parser — syntax analysis</text>
  <text x="500" y="518" text-anchor="middle" class="f">src/parser.h · src/parser.cpp</text>
  <text x="500" y="536" text-anchor="middle" class="b">Recursive descent: CREATE/INSERT/SELECT/UPDATE/DELETE</text>
  <text x="500" y="551" text-anchor="middle" class="b">WHERE precedence: OR &lt; AND &lt; comparison</text>

  <!-- ===================== Semantic ===================== -->
  <line x1="500" y1="560" x2="500" y2="606" class="flow" marker-end="url(#arr)"/>
  <text x="512" y="588" class="lbl">③ std::vector&lt;Stmt&gt; (AST)</text>
  <rect x="330" y="610" width="340" height="80" rx="8" fill="#E8F0FE" stroke="#3B6FD8" stroke-width="2"/>
  <text x="500" y="632" text-anchor="middle" class="t">Semantic analyzer</text>
  <text x="500" y="648" text-anchor="middle" class="f">src/semantic.h · src/semantic.cpp</text>
  <text x="500" y="666" text-anchor="middle" class="b">checkStatement(): table / column exists?</text>
  <text x="500" y="681" text-anchor="middle" class="b">value count matches? WHERE &amp; ORDER BY columns valid?</text>

  <!-- ===================== Executor ===================== -->
  <line x1="500" y1="690" x2="500" y2="736" class="flow" marker-end="url(#arr)"/>
  <text x="488" y="718" text-anchor="end" class="lbl">④ each validated Stmt</text>
  <rect x="330" y="740" width="340" height="80" rx="8" fill="#E8F0FE" stroke="#3B6FD8" stroke-width="2"/>
  <text x="500" y="762" text-anchor="middle" class="t">Executor — execution engine</text>
  <text x="500" y="778" text-anchor="middle" class="f">src/executor.h · src/executor.cpp</text>
  <text x="500" y="796" text-anchor="middle" class="b">Runs each statement: filter rows with WHERE,</text>
  <text x="500" y="811" text-anchor="middle" class="b">stable_sort for ORDER BY, project, print table</text>

  <!-- ===================== Output ===================== -->
  <line x1="500" y1="820" x2="500" y2="866" class="flow" marker-end="url(#arr)"/>
  <text x="512" y="848" class="lbl">printed results</text>
  <rect x="330" y="870" width="340" height="60" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="500" y="893" text-anchor="middle" class="t">Console output (stdout)</text>
  <text x="500" y="913" text-anchor="middle" class="b">+----+ ASCII tables · “1 row inserted” · ERROR: …</text>

  <!-- ===================== LEFT: token ===================== -->
  <rect x="40" y="350" width="230" height="210" rx="8" fill="#FFF4E0" stroke="#C98A1B" stroke-width="1.5"/>
  <text x="155" y="374" text-anchor="middle" class="t">Token definitions</text>
  <text x="155" y="391" text-anchor="middle" class="f">src/token.h · src/token.cpp</text>
  <text x="155" y="418" text-anchor="middle" class="b">enum TokenType: keywords,</text>
  <text x="155" y="434" text-anchor="middle" class="b">IDENTIFIER, NUMBER, STRING,</text>
  <text x="155" y="450" text-anchor="middle" class="b">= &gt; &lt; &gt;= &lt;=, punctuation, EOF</text>
  <text x="155" y="474" text-anchor="middle" class="b">struct Token { type, text, line }</text>
  <text x="155" y="498" text-anchor="middle" class="b">tokenTypeToString() helper</text>
  <text x="155" y="530" text-anchor="middle" class="dl">Lexer creates · Parser reads</text>
  <line x1="270" y1="390" x2="326" y2="390" class="dep" marker-start="url(#arrd)"/>
  <line x1="270" y1="520" x2="326" y2="520" class="dep" marker-start="url(#arrd)"/>

  <!-- ===================== LEFT: catalog ===================== -->
  <rect x="40" y="610" width="230" height="210" rx="8" fill="#FFF4E0" stroke="#C98A1B" stroke-width="1.5"/>
  <text x="155" y="634" text-anchor="middle" class="t">Catalog (schema)</text>
  <text x="155" y="651" text-anchor="middle" class="f">src/catalog.h · src/catalog.cpp</text>
  <text x="155" y="678" text-anchor="middle" class="b">map: table → column names</text>
  <text x="155" y="702" text-anchor="middle" class="b">registerTable(), tableExists(),</text>
  <text x="155" y="718" text-anchor="middle" class="b">columnExists(), getColumns()</text>
  <text x="155" y="748" text-anchor="middle" class="dl">Semantic reads + registers tables</text>
  <text x="155" y="764" text-anchor="middle" class="dl">Executor holds a reference</text>
  <text x="155" y="780" text-anchor="middle" class="dl">(currently unused there)</text>
  <line x1="270" y1="650" x2="326" y2="650" class="dep" marker-start="url(#arrd)" marker-end="url(#arrd)"/>
  <line x1="270" y1="790" x2="326" y2="790" class="dep" marker-start="url(#arrd)"/>

  <!-- ===================== RIGHT: AST ===================== -->
  <rect x="730" y="480" width="230" height="210" rx="8" fill="#FFF4E0" stroke="#C98A1B" stroke-width="1.5"/>
  <text x="845" y="504" text-anchor="middle" class="t">AST definitions</text>
  <text x="845" y="521" text-anchor="middle" class="f">src/ast.h (header only)</text>
  <text x="845" y="548" text-anchor="middle" class="b">Stmt { StmtType + one of: }</text>
  <text x="845" y="564" text-anchor="middle" class="b">CreateTable · Insert · Select</text>
  <text x="845" y="580" text-anchor="middle" class="b">Update · Delete  Stmt structs</text>
  <text x="845" y="604" text-anchor="middle" class="b">Expr tree for WHERE:</text>
  <text x="845" y="620" text-anchor="middle" class="b">LITERAL_NUM/STR, COLUMN_REF,</text>
  <text x="845" y="636" text-anchor="middle" class="b">BINARY(op, left, right)</text>
  <text x="845" y="662" text-anchor="middle" class="dl">Parser builds · Semantic,</text>
  <text x="845" y="678" text-anchor="middle" class="dl">Executor &amp; main read</text>
  <line x1="674" y1="520" x2="730" y2="520" class="dep" marker-end="url(#arrd)"/>
  <line x1="674" y1="650" x2="730" y2="650" class="dep" marker-end="url(#arrd)"/>
  <path d="M845,690 L845,715 L640,715 L640,740" class="dep" marker-start="url(#arrd)"/>

  <!-- ===================== RIGHT: Storage ===================== -->
  <rect x="730" y="740" width="230" height="110" rx="8" fill="#FFF4E0" stroke="#C98A1B" stroke-width="1.5"/>
  <text x="845" y="764" text-anchor="middle" class="t">Storage (in-memory)</text>
  <text x="845" y="781" text-anchor="middle" class="f">src/storage.h · src/storage.cpp</text>
  <text x="845" y="803" text-anchor="middle" class="b">Table { name, columns, rows }</text>
  <text x="845" y="819" text-anchor="middle" class="b">createTable · insertRow · getTable</text>
  <text x="845" y="839" text-anchor="middle" class="dl">Executor reads &amp; mutates rows</text>
  <line x1="674" y1="790" x2="730" y2="790" class="dep" marker-start="url(#arrd)" marker-end="url(#arrd)"/>

  <!-- ===================== Legend ===================== -->
  <rect x="40" y="965" width="920" height="70" rx="8" fill="#FAFAFA" stroke="#E5E7EB"/>
  <line x1="60" y1="988" x2="110" y2="988" class="flow" marker-end="url(#arr)"/>
  <text x="120" y="992" class="b">data flow through the pipeline (main.cpp passes each result to the next step)</text>
  <line x1="60" y1="1014" x2="110" y2="1014" class="dep" marker-end="url(#arrd)"/>
  <text x="120" y="1018" class="b">uses / depends on (#include + calls)</text>
  <rect x="560" y="1004" width="14" height="14" rx="3" fill="#E8F0FE" stroke="#3B6FD8"/>
  <text x="580" y="1016" class="b">compiler stage</text>
  <rect x="690" y="1004" width="14" height="14" rx="3" fill="#FFF4E0" stroke="#C98A1B"/>
  <text x="710" y="1016" class="b">shared data model</text>
  <rect x="840" y="1004" width="14" height="14" rx="3" fill="#EDE7F6" stroke="#6A4FB5"/>
  <text x="860" y="1016" class="b">driver</text>
</svg>
